name: build-firmware

# 小米路由器 3A (ramips/mt76x8) / OpenWrt 24.10.8
#
# 与旧版 (ImageBuilder) 的区别：
#   ImageBuilder 和 SDK 都**不能**编译内核模块（官方不提供内核源码），
#   而 rkp-ipid 是 kmod，必须和内核同一个构建里出，否则 vermagic 对不上、
#   insmod 直接失败。所以这里走完整 buildroot 源码构建。
#   代价：首次 ~50-70 分钟；之后有 dl 缓存会快一些。
#
# 固件组成：
#   1. OpenWrt 24.10.8 官方源码 (tag v24.10.8)
#   2. packages/rkp-ipid        —— 内核模块 kmod-rkp-ipid (源码)
#   3. package-src/ua3f-bin     —— UA3F，把 local-ipk 里的预编译 ipk 解包成文件包
#   4. files/                   —— 根文件系统覆盖层 (uci-defaults / init.d)

on:
  workflow_dispatch:
    inputs:
      extra_packages:
        description: '额外软件包 (空格分隔，不带 CONFIG_PACKAGE_ 前缀)'
        required: false
        default: 'luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn tcpdump iperf3 mtr-nojson'
      remove_packages:
        description: '要从固件里剔除的包 (空格分隔，可留空)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-firmware.yml'
      - 'packages/**'
      - 'package-src/**'
      - 'files/**'
      - 'local-ipk/**'

permissions:
  contents: read

concurrency:
  group: build-firmware-${{ github.ref }}
  cancel-in-progress: false

env:
  OW_VER: '24.10.8'
  OW_TAG: 'v24.10.8'
  TARGET: 'ramips/mt76x8'
  PROFILE: 'xiaomi_miwifi-3a'
  IMG_MAX: '15204352'
  SRC: ${{ github.workspace }}/openwrt-src
  DL_CACHE: ${{ github.workspace }}/.dl-cache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 磁盘与内核信息
        run: |
          df -h /
          nproc
          free -m

      - name: 恢复下载缓存 (dl/)
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DL_CACHE }}
          key: ow-dl-${{ env.OW_VER }}-${{ github.run_id }}
          restore-keys: |
            ow-dl-${{ env.OW_VER }}-

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison clang cpio file flex g++ gawk gcc-multilib \
            g++-multilib gettext git libelf-dev libncurses-dev libssl-dev \
            python3 python3-dev python3-distutils python3-setuptools rsync \
            swig time unzip wget zlib1g-dev zstd

      - name: 拉取 OpenWrt 源码
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$OW_TAG" https://github.com/openwrt/openwrt.git "$SRC"
          cd "$SRC"
          git log -1 --pretty='源码: %h %s'
          # 内核版本必须与设备一致 (24.10.8 -> 6.6.144)
          grep -m1 '^LINUX_VERSION-6.6' include/kernel-6.6 || true

          mkdir -p dl
          if [ -d "$DL_CACHE" ]; then
            rsync -a "$DL_CACHE"/ dl/ || true
            echo "dl 缓存条目: $(ls dl | wc -l) 个"
          fi

      # 编译缓存：staging_dir 与 build_dir 必须成对，缺一不可。
      # 事故记录（run 45193093967，21 分钟白跑）：只缓存 staging_dir 时，恢复后
      # staging_dir/host 里躺着装好的交叉工具链，但 build_dir 是空的 —— 没有 .built 时间戳、
      # 没有中间对象。于是 make 一边认为工具链该重编，一边在一个已被污染的 staging_dir 上重编，
      # 直接 `ERROR: toolchain/binutils failed to build.`。两者同源同 key 保存才不会错配。
      - name: 恢复编译缓存 (staging_dir + build_dir)
        id: full-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.SRC }}/staging_dir
            ${{ env.SRC }}/build_dir
          key: ow-full-${{ env.OW_VER }}-${{ github.run_id }}
          restore-keys: |
            ow-full-${{ env.OW_VER }}-

      - name: 缓存一致性检查
        # 注意：cache-hit 只在 key 精确命中时才是 true；用 restore-keys 前缀命中
        # 时它是 false，缓存其实已经恢复了。判断"有没有恢复"要用 cache-matched-key。
        if: steps.full-cache.outputs.cache-matched-key != ''
        run: |
          set -euo pipefail
          cd "$SRC"
          if ! ls -d build_dir/target-* >/dev/null 2>&1; then
            echo "::warning::命中的缓存缺少 build_dir/target-*，为避免污染当前 staging_dir，整对丢弃"
            rm -rf staging_dir build_dir
          else
            echo "缓存一致，build_dir:"
            ls -d build_dir/target-*
            du -sh staging_dir build_dir || true
          fi

      - name: feeds update + install
        run: |
          set -euo pipefail
          cd "$SRC"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 放入自定义包
        run: |
          set -euo pipefail
          cd "$SRC"

          # ---- 1. rkp-ipid (kmod, 走源码) ----
          mkdir -p package/rkp-ipid
          cp -r "$GITHUB_WORKSPACE/packages/rkp-ipid/." package/rkp-ipid/
          echo "[rkp-ipid] $(ls package/rkp-ipid)"

          # ---- 1b. tcpts-strip (kmod, 抹掉出网 SYN 里的 TCP 时间戳选项) ----
          mkdir -p package/tcpts-strip
          cp -r "$GITHUB_WORKSPACE/packages/tcpts-strip/." package/tcpts-strip/
          echo "[tcpts-strip] $(ls package/tcpts-strip) / src: $(ls package/tcpts-strip/src)"

          # ---- 2. ua2f (C 实现，源码 vendor 在 package-src/ua2f/src.tar.gz) ----
          # ua3f 那个 17.6MB 的 Go 二进制在这颗 MT7628 上启动即卡死（A/B 实测 CPU 100%、
          # 进程 D 状态、规则都没建），已经整包移出构建，只保留 UA2F。
          mkdir -p package/ua2f
          cp "$GITHUB_WORKSPACE/package-src/ua2f/Makefile" package/ua2f/Makefile
          cp "$GITHUB_WORKSPACE/package-src/ua2f/src.tar.gz" package/ua2f/src.tar.gz
          echo "[ua2f] src.tar.gz sha256: $(sha256sum package/ua2f/src.tar.gz | cut -d' ' -f1)"
          # 别用 `tar -tzf ... | head -3`：head 提前关管道，tar 报 "stdout: write error" 退 2，
          # 配上 set -e/pipefail 会把整个步骤判失败（踩过一次）。sed 会读完整个流，安全。
          tar -tzf package/ua2f/src.tar.gz | sed -n '1,3p'

          # ---- 3. 根文件系统覆盖层 ----
          # Windows 上 git core.filemode=false，可执行位不可靠，这里强制修一遍
          find "$GITHUB_WORKSPACE/files" -type f -name '*.sh' -exec chmod 755 {} + 2>/dev/null || true
          chmod 755 "$GITHUB_WORKSPACE"/files/etc/init.d/* 2>/dev/null || true
          chmod 755 "$GITHUB_WORKSPACE"/files/etc/uci-defaults/* 2>/dev/null || true
          chmod 755 "$GITHUB_WORKSPACE"/files/usr/bin/* 2>/dev/null || true
          mkdir -p files
          cp -r "$GITHUB_WORKSPACE/files/." files/
          find files -type f -exec ls -l {} \;

      - name: 生成 .config
        env:
          # push 触发时 github.event.inputs.* 是空的，必须带兜底默认值，
          # 否则中文界面 / tcpdump / iperf3 / mtr-nojson 会静默丢掉（第一次构建就踩了这个坑）
          EXTRA_PKGS: ${{ github.event.inputs.extra_packages || 'luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn tcpdump iperf3 mtr-nojson' }}
          REMOVE_PKGS: ${{ github.event.inputs.remove_packages }}
        run: |
          set -euo pipefail
          cd "$SRC"

          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_xiaomi_miwifi-3a=y
          CONFIG_TARGET_MULTI_PROFILE=n
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_EXT4FS=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL_NONSHARED=n
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-compat=y
          # luci-i18n-*-zh-cn 是 HIDDEN 包，必须用 LUCI_LANG 开关带出来
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_kmod-rkp-ipid=y
          CONFIG_PACKAGE_kmod-tcpts-strip=y
          # ua3f 已移出构建（Go 二进制在这颗 CPU 上跑不起来），改用 C 实现的 ua2f
          CONFIG_PACKAGE_ua2f=y
          CONFIG_PACKAGE_libnetfilter-queue=y
          CONFIG_PACKAGE_libnetfilter-conntrack=y
          CONFIG_PACKAGE_kmod-nft-queue=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_iptables-nft=y
          CONFIG_PACKAGE_iptables-mod-tproxy=y
          CONFIG_PACKAGE_iptables-mod-extra=y
          CONFIG_PACKAGE_iptables-mod-ipopt=y
          CONFIG_PACKAGE_iptables-mod-nfqueue=y
          CONFIG_PACKAGE_iptables-mod-conntrack-extra=y
          CONFIG_PACKAGE_iptables-mod-filter=y
          CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y
          # 下面三个是「虚拟依赖」的真实提供者，必须显式选，否则收包阶段报
          # pkg_hash_check_unresolved（sqm-scripts 要 tc、mwan3 要 ip6tables）
          CONFIG_PACKAGE_tc-tiny=y
          CONFIG_PACKAGE_ip6tables-nft=y
          CONFIG_PACKAGE_ipset=y
          EOF

          # ---- 内置附加包 ----
          # 都是官方索引里核实过真实存在的包名（不是 PROVIDES 别名），体积合计约 1.1 MB。
          # 打进镜像比 opkg 装进 overlay 省 2–3 倍空间（squashfs 有压缩），
          # 但总量还是受 mtd7 那 15,204,352 B 约束，所以这批只挑「装上就回不去」的。
          BUILTIN_PKGS="
            openssh-sftp-server nano curl htop conntrack iftop lsof kmod-tcp-bbr luci-app-commands
            ttyd luci-app-ttyd watchcat luci-app-watchcat
            nlbwmon luci-app-nlbwmon luci-app-vnstat2
            sqm-scripts kmod-sched-cake luci-app-sqm
            mwan3 luci-app-mwan3
            wireguard-tools kmod-wireguard luci-proto-wireguard
            miniupnpd-nftables luci-app-upnp
            https-dns-proxy luci-app-https-dns-proxy
            etherwake luci-app-wol
          "

          for p in $BUILTIN_PKGS; do
            echo "CONFIG_PACKAGE_$p=y" >> .config
          done
          for p in $EXTRA_PKGS; do
            echo "CONFIG_PACKAGE_$p=y" >> .config
          done
          for p in $REMOVE_PKGS; do
            echo "# CONFIG_PACKAGE_$p is not set" >> .config
          done

          make defconfig

          echo '--- 关键符号自检 ---'
          fail=0
          for s in \
            CONFIG_PACKAGE_kmod-rkp-ipid \
            CONFIG_PACKAGE_kmod-tcpts-strip \
            CONFIG_PACKAGE_ua2f \
            CONFIG_PACKAGE_kmod-nft-queue \
            CONFIG_PACKAGE_libnetfilter-queue \
            CONFIG_PACKAGE_luci \
            CONFIG_PACKAGE_luci-compat \
            CONFIG_PACKAGE_iptables-mod-tproxy \
            CONFIG_PACKAGE_iptables-mod-filter \
            CONFIG_PACKAGE_kmod-nf-conntrack-netlink \
            CONFIG_PACKAGE_tc-tiny \
            CONFIG_PACKAGE_ip6tables-nft \
            CONFIG_PACKAGE_ipset \
            CONFIG_PACKAGE_iptables-nft
          do
            if grep -q "^${s}=y" .config; then
              echo "OK   $s"
            else
              echo "MISS $s"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo '有必需符号没进 .config，先修配置再编译'; exit 1; }

          # 额外包也必须真的落到 .config 里 —— 否则包名写错（比如 mtr 是 PROVIDES 别名、
          # luci-i18n-* 是 HIDDEN 包）会一声不吭地丢包，编译成功但镜像里没有
          echo '--- 额外包自检 ---'
          for p in $BUILTIN_PKGS; do
            if grep -qE "^(CONFIG_PACKAGE_${p}=[ym])" .config; then
              echo "OK   $p"
            else
              echo "::error::内置包 $p 没有进 .config（包名可能不存在，或被 defconfig 丢弃）"
              fail=1
            fi
          done
          for p in $EXTRA_PKGS; do
            if grep -qE "^(CONFIG_PACKAGE_${p}=[ym]|CONFIG_PACKAGE_${p}=y)" .config; then
              echo "OK   $p"
            else
              echo "::error::额外包 $p 没有进 .config（包名可能不存在，或被 defconfig 丢弃）"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo '额外包校验失败，先修包名再编译'; exit 1; }

          # 互斥包检查：两个包声明了 Conflicts 还同时 =y，会在最后的
          # package/install（opkg 收货）阶段炸掉，而且 make 只留一行 "world failed"，
          # 看不出是谁冲突（#14/#15 就是这么白烧两轮的）。
          echo '--- 互斥包检查 ---'
          for pair in "vnstat vnstat2" "vnstat vnstati2" "iperf3 iperf3-ssl"; do
            set -- $pair
            if grep -q "^CONFIG_PACKAGE_$1=y" .config && grep -qE "^CONFIG_PACKAGE_$2=[ym]" .config; then
              echo "::error::$1 与 $2 互斥（后者 Conflicts: $1），不能同时进镜像"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo '互斥包同时被选中，先修 .config'; exit 1; }

          echo '--- 设备 profile ---'
          grep -E '^CONFIG_TARGET_ramips_mt76x8_DEVICE' .config

      - name: 预下载源码包
        run: |
          cd "$SRC"
          make -j8 download || echo '::warning::部分源码包下载失败，交给编译阶段重试'

      - name: 编译 (make -j)
        run: |
          set -o pipefail
          cd "$SRC"
          make -j"$(($(nproc)+1))" 2>&1 | tee build.log

      - name: 失败时打印错误现场
        if: failure()
        run: |
          cd "$SRC"
          echo '===== tail build.log ====='
          tail -n 200 build.log 2>/dev/null || true
          echo '===== 依赖 / 冲突类真实报错 ====='
          grep -nEi 'pkg_hash_check_unresolved|missing dependencies|Collected errors|check_data_file_clashes|Cannot install|is not available|unsatisfied|conflict' build.log 2>/dev/null | tail -n 120 || true
          echo '===== 关键字 ====='
          grep -nEi '(^make.*\*\*\*|error:|Error [0-9]+|failed)' build.log 2>/dev/null | tail -n 80 || true

      - name: 失败时上传 build.log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: ${{ env.SRC }}/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 失败时复现收包错误
        if: failure()
        run: |
          cd "$SRC"
          # V=0 下 package/install 失败可能一个字都不打（只留一行 world failed），
          # 这里用 V=s 单线程重跑收包阶段，把真正的 opkg 报错逼出来
          timeout 600 make -j1 V=s package/install 2>&1 | tail -n 250 || true

      - name: 校验产物
        run: |
          set -euo pipefail
          cd "$SRC"

          echo '===== 内核模块是否真的编出来了 ====='
          KO=$(find build_dir -name 'rkp-ipid.ko' -type f 2>/dev/null | head -1 || true)
          if [ -z "${KO:-}" ]; then
            echo 'rkp-ipid.ko 没生成'
            exit 1
          fi
          ls -l "$KO"
          strings "$KO" | grep -i '^vermagic=' || true

          KOTS=$(find build_dir -name 'tcpts-strip.ko' -type f 2>/dev/null | sed -n '1p' || true)
          if [ -z "${KOTS:-}" ]; then
            echo 'tcpts-strip.ko 没生成'
            exit 1
          fi
          ls -l "$KOTS"
          strings "$KOTS" | grep -i '^vermagic=' || true

          echo '===== 根文件系统内容抽查 ====='
          ROOT=$(find build_dir -maxdepth 2 -type d -name 'root-ramips' 2>/dev/null | head -1 || true)
          if [ -z "${ROOT:-}" ]; then
            echo '找不到 root-ramips 临时根目录'
            exit 1
          fi
          for f in usr/bin/ua2f etc/init.d/ua2f etc/config/ua2f etc/uci-defaults/93-ua2f \
                   etc/init.d/rkp-ipid-mark etc/uci-defaults/90-rkp-ipid \
                   usr/bin/ybu-login etc/init.d/ybu-login etc/config/ybu etc/uci-defaults/95-ybu etc/uci-defaults/96-macclone \
                   etc/init.d/ganyu-guard etc/config/ganyu etc/uci-defaults/97-ganyu etc/uci-defaults/98-wan-sta \
                   usr/bin/ganyu-status \
                   etc/uci-defaults/94-bbr etc/uci-defaults/92-packfix \
                   etc/uci-defaults/88-bindlan etc/uci-defaults/89-wan-hostname \
                   etc/uci-defaults/86-wan-dhcp \
                   etc/hotplug.d/iface/96-harden-wan \
                   usr/share/luci/menu.d/luci-app-ganyu.json \
                   usr/share/rpcd/acl.d/luci-app-ganyu.json \
                   www/luci-static/resources/view/ganyu/status.js; do
            if [ -e "$ROOT/$f" ]; then
              echo "OK   /$f"
            else
              echo "MISS /$f"
              exit 1
            fi
          done
          test -x "$ROOT/etc/init.d/rkp-ipid-mark" || { echo 'init.d/rkp-ipid-mark 没有可执行位'; exit 1; }
          # 两个自编内核模块必须落进 /lib/modules
          ls "$ROOT/lib/modules/6.6.144/rkp-ipid.ko" >/dev/null 2>&1 || { echo 'rootfs 里没有 rkp-ipid.ko'; exit 1; }
          ls "$ROOT/lib/modules/6.6.144/tcpts-strip.ko" >/dev/null 2>&1 || { echo 'rootfs 里没有 tcpts-strip.ko'; exit 1; }
          for f in etc/init.d/ganyu-guard etc/init.d/ybu-login usr/bin/ybu-login etc/init.d/ua2f etc/uci-defaults/93-ua2f etc/uci-defaults/98-wan-sta usr/bin/ganyu-status etc/uci-defaults/94-bbr etc/uci-defaults/92-packfix etc/uci-defaults/88-bindlan etc/uci-defaults/89-wan-hostname etc/uci-defaults/86-wan-dhcp etc/hotplug.d/iface/96-harden-wan; do
            test -x "$ROOT/$f" || { echo "$f 没有可执行位"; exit 1; }
          done

          # 反检测状态页：菜单项必须指向 ganyu/status，ACL 必须放行 ganyu-status，
          # 视图文件必须真的在 /www 下（否则 LuCI 打开是空白页）
          grep -q 'ganyu/status' "$ROOT/usr/share/luci/menu.d/luci-app-ganyu.json" || {
            echo 'menu.d 里找不到 ganyu/status 路由'; exit 1; }
          grep -q '/usr/bin/ganyu-status' "$ROOT/usr/share/rpcd/acl.d/luci-app-ganyu.json" || {
            echo 'ACL 里没有放行 ganyu-status 的 exec 权限'; exit 1; }
          grep -q 'ganyu-status' "$ROOT/www/luci-static/resources/view/ganyu/status.js" || {
            echo 'LuCI 视图没有调用 /usr/bin/ganyu-status'; exit 1; }

          # 附加包里有两个"装上就接管网络"的服务：https-dns-proxy 会把 dnsmasq 上游换成
          # 需要外网的 DoH（未认证校园网 → 全部解析超时），mwan3 会把单 WAN 判成 offline。
          # 92-packfix 必须在最终 rootfs 里，且确实写着要停用它们，否则刷上去就断网。
          grep -q 'https-dns-proxy' "$ROOT/etc/uci-defaults/92-packfix" || {
            echo '92-packfix 里没有停用 https-dns-proxy 的逻辑'; exit 1; }
          grep -q 'mwan3' "$ROOT/etc/uci-defaults/92-packfix" || {
            echo '92-packfix 里没有停用 mwan3 的逻辑'; exit 1; }

          # 指纹补丁四条：管理面绑 br-lan、DHCP hostname 不再叫 OpenWrt、
          # ua2f 不再整段跳过 10.0.0.0/8（校园网就在这段里，跳了等于校内 HTTP 的 UA 原样出网）、
          # 门户心跳带抖动（固定 60s 准点探测本身就是节奏指纹）
          grep -q 'listen_http' "$ROOT/etc/uci-defaults/88-bindlan" || {
            echo '88-bindlan 里没有把 uhttpd 绑到 br-lan'; exit 1; }
          grep -q 'network.wan.hostname' "$ROOT/etc/uci-defaults/89-wan-hostname" || {
            echo '89-wan-hostname 里没有设置 DHCP hostname'; exit 1; }

          # WAN 口的"别当路由器"开关：hotplug 必须在，init 里也有兜底。
          grep -q 'forwarding' "$ROOT/etc/hotplug.d/iface/96-harden-wan" || {
            echo '96-harden-wan 里没有关 v6 forwarding'; exit 1; }
          grep -q 'send_redirects' "$ROOT/etc/hotplug.d/iface/96-harden-wan" || {
            echo '96-harden-wan 里没有关 send_redirects'; exit 1; }
          grep -q 'harden_wan' "$ROOT/etc/init.d/ganyu-guard" || {
            echo 'ganyu-guard 里没有 harden_wan 兜底'; exit 1; }
          if grep -q '0.0.0.0/8, 10.0.0.0/8' "$ROOT/etc/init.d/ua2f"; then
            echo '::error::ua2f 的 localaddr_v4 仍包含 10.0.0.0/8，校内 HTTP 的 UA 不会被改写'
            exit 1
          fi
          grep -q 'rand()' "$ROOT/usr/bin/ybu-login" || {
            echo 'ybu-login 的守护循环没有加抖动'; exit 1; }

          # 第二批：DoH 封锁、input 兜底、DHCP vendor-class、ua2f 覆盖 8080、canary
          grep -q 'block_doh' "$ROOT/etc/init.d/ganyu-guard" || {
            echo '::error::ganyu-guard 里没有 block_doh'; exit 1; }
          grep -q "option block_doh" "$ROOT/etc/config/ganyu" || {
            echo '::error::/etc/config/ganyu 缺少 block_doh 开关'; exit 1; }
          grep -q 'use-application-dns.net' "$ROOT/etc/init.d/ganyu-guard" || {
            echo '::error::ganyu-guard 里没有 dnsmasq canary'; exit 1; }
          grep -q 'MSFT 5.0' "$ROOT/etc/uci-defaults/86-wan-dhcp" || {
            echo '::error::86-wan-dhcp 里没有 vendor-class'; exit 1; }
          grep -q '{ 80, 8080 }' "$ROOT/etc/init.d/ua2f" || {
            echo '::error::ua2f 没有覆盖 8080 端口'; exit 1; }
          grep -q '3c:a9:f4' "$ROOT/etc/uci-defaults/96-macclone" || {
            echo '::error::96-macclone 没有自动生成非小米 OUI 的 MAC'; exit 1; }

          # 三个断言：ua2f 用的是我们改过的配置（不是包自带默认）、init 走的是 NFQUEUE 而不是 iptables 老路、
          # 而且 ua3f 那种"装了但跑不动"的包这次真的不该再出现在镜像里
          # 注意：断言必须跟着 custom_ua 一起改 —— 这里原来看的是 'Edg/'，
          # 后来 UA 换成 111 字节的 Chrome 串（ua2f 是原地等长替换，太长会被截断），
          # 断言没跟着改，直接把 #16 一个已经编好的镜像判成失败（白烧一轮）。
          grep -q 'Chrome/131.0.0.0 Safari/537.36' "$ROOT/etc/config/ua2f" || {
            echo 'etc/config/ua2f 不是 files/ 覆盖层那一份（custom_ua 没生效？）'; exit 1; }
          if grep -q 'Edg/' "$ROOT/etc/config/ua2f"; then
            echo '::error::custom_ua 还是旧的 125 字节带 Edg 的串，ua2f 会把它截断'
            exit 1
          fi
          grep -q 'queue num 10010' "$ROOT/etc/init.d/ua2f" || {
            echo 'init.d/ua2f 里找不到 NFQUEUE 规则'; exit 1; }
          # IPv6 兜底：v4-only 的三件套挡不住 SLAAC 的全局地址，必须真封 v6 转发
          grep -q 'block_ipv6' "$ROOT/etc/init.d/ganyu-guard" || {
            echo '::error::ganyu-guard 里没有 block_ipv6，IPv6 会绕开整套伪装'; exit 1; }
          grep -q "option block_ipv6" "$ROOT/etc/config/ganyu" || {
            echo '::error::/etc/config/ganyu 缺少 block_ipv6 开关'; exit 1; }
          if [ -e "$ROOT/usr/bin/ua3f" ]; then
            echo '::error::ua3f 仍然被打进镜像了，检查 CONFIG_PACKAGE_ua3f-bin 是否已移出 .config'
            exit 1
          fi

          echo '===== 镜像体积 ====='
          IMG=$(ls bin/targets/"$TARGET"/*"${PROFILE}"*squashfs-sysupgrade.bin | sed -n '1p')
          SZ=$(stat -c%s "$IMG")
          echo "镜像: $IMG"
          echo "大小: $SZ 字节"
          awk -v s="$SZ" -v m="$IMG_MAX" 'BEGIN{printf "占用 %.2f MiB / %.2f MiB (%.1f%%)\n", s/1048576, m/1048576, s*100/m}'
          if [ "$SZ" -gt "$IMG_MAX" ]; then
            echo "::error::镜像 $SZ 字节超过 mtd7 firmware 分区上限 $IMG_MAX 字节"
            exit 1
          fi
          sha256sum "$IMG"

          echo '===== manifest 关键行 ====='
          grep -E '^ua2f|^libnetfilter|^kmod-nft-queue|^libmnl|^kmod-rkp-ipid|^kmod-tcpts-strip|^iptables|^tcpdump|^iperf3|^mtr|^luci-i18n' bin/targets/"$TARGET"/*.manifest || true

      - name: 失败时也上传镜像（供排查）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-image-${{ github.run_number }}
          path: |
            openwrt-src/bin/targets/ramips/mt76x8/*sysupgrade.bin
            openwrt-src/bin/targets/ramips/mt76x8/*.manifest
            openwrt-src/bin/targets/ramips/mt76x8/sha256sums
            openwrt-src/.config
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OW_VER }}-miwifi-3a-${{ github.run_number }}
          path: |
            openwrt-src/bin/targets/ramips/mt76x8/*sysupgrade.bin
            openwrt-src/bin/targets/ramips/mt76x8/*.manifest
            openwrt-src/bin/targets/ramips/mt76x8/sha256sums
            openwrt-src/.config
            openwrt-src/build.log
          if-no-files-found: error
          retention-days: 30
          # v4.4 起隐藏文件默认不上传，.config 会被漏掉（本次就漏了），必须显式打开
          include-hidden-files: true

      - name: 保存下载缓存
        if: always()
        run: |
          mkdir -p "$DL_CACHE"
          rsync -a "$SRC"/dl/ "$DL_CACHE"/ || true
          du -sh "$DL_CACHE" || true

      - name: 提交下载缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DL_CACHE }}
          key: ow-dl-${{ env.OW_VER }}-${{ github.run_id }}

      - name: 提交编译缓存
        # 只有"这次没恢复到缓存"且编译成功才存，避免把失败现场的残缺 staging_dir 存成毒缓存
        if: success() && steps.full-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.SRC }}/staging_dir
            ${{ env.SRC }}/build_dir
          key: ow-full-${{ env.OW_VER }}-${{ github.run_id }}
