name: build-firmware

# 小米路由器 3A (ramips/mt76x8) / OpenWrt 24.10.8
#
# 与旧版 (ImageBuilder) 的区别：
#   ImageBuilder 和 SDK 都**不能**编译内核模块（官方不提供内核源码），
#   而 rkp-ipid 是 kmod，必须和内核同一个构建里出，否则 vermagic 对不上、
#   insmod 直接失败。所以这里走完整 buildroot 源码构建。
#   代价：首次 ~50-70 分钟；之后有 dl 缓存会快一些。
#
# 固件组成：
#   1. OpenWrt 24.10.8 官方源码 (tag v24.10.8)
#   2. packages/rkp-ipid        —— 内核模块 kmod-rkp-ipid (源码)
#   3. package-src/ua3f-bin     —— UA3F，把 local-ipk 里的预编译 ipk 解包成文件包
#   4. files/                   —— 根文件系统覆盖层 (uci-defaults / init.d)

on:
  workflow_dispatch:
    inputs:
      extra_packages:
        description: '额外软件包 (空格分隔，不带 CONFIG_PACKAGE_ 前缀)'
        required: false
        default: 'luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-package-manager-zh-cn tcpdump iperf3 mtr'
      remove_packages:
        description: '要从固件里剔除的包 (空格分隔，可留空)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-firmware.yml'
      - 'packages/**'
      - 'package-src/**'
      - 'files/**'
      - 'local-ipk/**'

permissions:
  contents: read

concurrency:
  group: build-firmware-${{ github.ref }}
  cancel-in-progress: true

env:
  OW_VER: '24.10.8'
  OW_TAG: 'v24.10.8'
  TARGET: 'ramips/mt76x8'
  PROFILE: 'xiaomi_miwifi-3a'
  IMG_MAX: '15204352'
  SRC: ${{ github.workspace }}/openwrt-src
  DL_CACHE: ${{ github.workspace }}/.dl-cache

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 磁盘与内核信息
        run: |
          df -h /
          nproc
          free -m

      - name: 恢复下载缓存 (dl/)
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.DL_CACHE }}
          key: ow-dl-${{ env.OW_VER }}-${{ github.run_id }}
          restore-keys: |
            ow-dl-${{ env.OW_VER }}-

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison clang cpio file flex g++ gawk gcc-multilib \
            g++-multilib gettext git libelf-dev libncurses-dev libssl-dev \
            python3 python3-dev python3-distutils python3-setuptools rsync \
            swig time unzip wget zlib1g-dev zstd

      - name: 拉取 OpenWrt 源码
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$OW_TAG" https://github.com/openwrt/openwrt.git "$SRC"
          cd "$SRC"
          git log -1 --pretty='源码: %h %s'
          # 内核版本必须与设备一致 (24.10.8 -> 6.6.144)
          grep -m1 '^LINUX_VERSION-6.6' include/kernel-6.6 || true

          mkdir -p dl
          if [ -d "$DL_CACHE" ]; then
            rsync -a "$DL_CACHE"/ dl/ || true
            echo "dl 缓存条目: $(ls dl | wc -l) 个"
          fi

      - name: feeds update + install
        run: |
          set -euo pipefail
          cd "$SRC"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 放入自定义包
        run: |
          set -euo pipefail
          cd "$SRC"

          # ---- 1. rkp-ipid (kmod, 走源码) ----
          mkdir -p package/rkp-ipid
          cp -r "$GITHUB_WORKSPACE/packages/rkp-ipid/." package/rkp-ipid/
          echo "[rkp-ipid] $(ls package/rkp-ipid)"

          # ---- 2. ua3f (预编译 ipk -> 文件包) ----
          mkdir -p package/ua3f-bin/files
          cp "$GITHUB_WORKSPACE/package-src/ua3f-bin/Makefile" package/ua3f-bin/Makefile
          IPK=$(ls "$GITHUB_WORKSPACE"/local-ipk/ua_*.ipk 2>/dev/null | head -1)
          if [ -z "${IPK:-}" ]; then
            echo "local-ipk/ 里找不到 ua_*.ipk"
            exit 1
          fi
          echo "[ua3f] 使用: $IPK"
          echo "[ua3f] sha256: $(sha256sum "$IPK" | cut -d' ' -f1)"
          # 注意：这个 ipk 不是标准 ar 归档，而是 tar.gz 套 debian-binary/control.tar.gz/data.tar.gz
          # 老 workflow 里那句 `ar p ... control.tar.gz` 在这儿从来就不可能成功，两种都要兼容
          TMP=$(mktemp -d)
          (
            cd "$TMP"
            case "$(head -c 7 "$IPK")" in
              '!<arch>'*) ar x "$IPK" ;;
              *)          tar -xzf "$IPK" ;;
            esac
            test -f data.tar.gz
            mkdir -p root
            tar -xzf data.tar.gz -C root
          )
          cp -r "$TMP/root/." package/ua3f-bin/files/
          rm -rf "$TMP"
          ls -l package/ua3f-bin/files/usr/bin/ua3f
          file package/ua3f-bin/files/usr/bin/ua3f

          # ---- 3. 根文件系统覆盖层 ----
          # Windows 上 git core.filemode=false，可执行位不可靠，这里强制修一遍
          find "$GITHUB_WORKSPACE/files" -type f -name '*.sh' -exec chmod 755 {} + 2>/dev/null || true
          chmod 755 "$GITHUB_WORKSPACE"/files/etc/init.d/* 2>/dev/null || true
          chmod 755 "$GITHUB_WORKSPACE"/files/etc/uci-defaults/* 2>/dev/null || true
          mkdir -p files
          cp -r "$GITHUB_WORKSPACE/files/." files/
          find files -type f -exec ls -l {} \;

      - name: 生成 .config
        env:
          EXTRA_PKGS: ${{ github.event.inputs.extra_packages }}
          REMOVE_PKGS: ${{ github.event.inputs.remove_packages }}
        run: |
          set -euo pipefail
          cd "$SRC"

          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_xiaomi_miwifi-3a=y
          CONFIG_TARGET_MULTI_PROFILE=n
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_EXT4FS=n
          CONFIG_ALL_KMODS=n
          CONFIG_ALL_NONSHARED=n
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_kmod-rkp-ipid=y
          CONFIG_PACKAGE_ua3f-bin=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_iptables=y
          CONFIG_PACKAGE_iptables-mod-tproxy=y
          CONFIG_PACKAGE_iptables-mod-extra=y
          CONFIG_PACKAGE_iptables-mod-ipopt=y
          CONFIG_PACKAGE_iptables-mod-nfqueue=y
          CONFIG_PACKAGE_iptables-mod-conntrack-extra=y
          CONFIG_PACKAGE_kmod-nf-conntrack-netlink=y
          EOF

          for p in $EXTRA_PKGS; do
            echo "CONFIG_PACKAGE_$p=y" >> .config
          done
          for p in $REMOVE_PKGS; do
            echo "# CONFIG_PACKAGE_$p is not set" >> .config
          done

          make defconfig

          echo '--- 关键符号自检 ---'
          fail=0
          for s in \
            CONFIG_PACKAGE_kmod-rkp-ipid \
            CONFIG_PACKAGE_ua3f-bin \
            CONFIG_PACKAGE_luci \
            CONFIG_PACKAGE_luci-compat \
            CONFIG_PACKAGE_iptables-mod-tproxy \
            CONFIG_PACKAGE_kmod-nf-conntrack-netlink
          do
            if grep -q "^${s}=y" .config; then
              echo "OK   $s"
            else
              echo "MISS $s"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || { echo '有必需符号没进 .config，先修配置再编译'; exit 1; }

          echo '--- 设备 profile ---'
          grep -E '^CONFIG_TARGET_ramips_mt76x8_DEVICE' .config

      - name: 预下载源码包
        run: |
          cd "$SRC"
          make -j8 download || echo '::warning::部分源码包下载失败，交给编译阶段重试'

      - name: 编译 (make -j)
        run: |
          set -o pipefail
          cd "$SRC"
          make -j"$(($(nproc)+1))" 2>&1 | tee build.log

      - name: 失败时打印错误现场
        if: failure()
        run: |
          cd "$SRC"
          echo '===== tail build.log ====='
          tail -n 200 build.log 2>/dev/null || true
          echo '===== 关键字 ====='
          grep -nEi '(^make.*\*\*\*|error:|Error [0-9]+|failed)' build.log 2>/dev/null | tail -n 80 || true

      - name: 校验产物
        run: |
          set -euo pipefail
          cd "$SRC"

          echo '===== 内核模块是否真的编出来了 ====='
          KO=$(find build_dir -name 'rkp-ipid.ko' -type f 2>/dev/null | head -1 || true)
          if [ -z "${KO:-}" ]; then
            echo 'rkp-ipid.ko 没生成'
            exit 1
          fi
          ls -l "$KO"
          strings "$KO" | grep -i '^vermagic=' || true

          echo '===== 根文件系统内容抽查 ====='
          ROOT=$(find build_dir -maxdepth 2 -type d -name 'root-ramips' 2>/dev/null | head -1 || true)
          if [ -z "${ROOT:-}" ]; then
            echo '找不到 root-ramips 临时根目录'
            exit 1
          fi
          for f in usr/bin/ua3f etc/init.d/ua3f etc/init.d/rkp-ipid-mark etc/uci-defaults/91-ua3f usr/lib/lua/luci/controller/ua3f.lua; do
            if [ -e "$ROOT/$f" ]; then
              echo "OK   /$f"
            else
              echo "MISS /$f"
              exit 1
            fi
          done
          test -x "$ROOT/etc/init.d/rkp-ipid-mark" || { echo 'init.d/rkp-ipid-mark 没有可执行位'; exit 1; }

          echo '===== 镜像体积 ====='
          IMG=$(ls bin/targets/"$TARGET"/*"${PROFILE}"*squashfs-sysupgrade.bin | head -1)
          SZ=$(stat -c%s "$IMG")
          echo "镜像: $IMG"
          echo "大小: $SZ 字节"
          awk -v s="$SZ" -v m="$IMG_MAX" 'BEGIN{printf "占用 %.2f MiB / %.2f MiB (%.1f%%)\n", s/1048576, m/1048576, s*100/m}'
          if [ "$SZ" -gt "$IMG_MAX" ]; then
            echo "::error::镜像 $SZ 字节超过 mtd7 firmware 分区上限 $IMG_MAX 字节"
            exit 1
          fi
          sha256sum "$IMG"

          echo '===== manifest 关键行 ====='
          grep -E '^kmod-rkp-ipid|^ua3f-bin|^iptables |^ipset ' bin/targets/"$TARGET"/*.manifest || true

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ env.OW_VER }}-miwifi-3a-${{ github.run_number }}
          path: |
            openwrt-src/bin/targets/ramips/mt76x8/*sysupgrade.bin
            openwrt-src/bin/targets/ramips/mt76x8/*.manifest
            openwrt-src/bin/targets/ramips/mt76x8/sha256sums
            openwrt-src/.config
            openwrt-src/build.log
          if-no-files-found: error
          retention-days: 30

      - name: 保存下载缓存
        if: always()
        run: |
          mkdir -p "$DL_CACHE"
          rsync -a "$SRC"/dl/ "$DL_CACHE"/ || true
          du -sh "$DL_CACHE" || true

      - name: 提交下载缓存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.DL_CACHE }}
          key: ow-dl-${{ env.OW_VER }}-${{ github.run_id }}
